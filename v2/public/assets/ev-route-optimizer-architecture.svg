<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title id="t">EV Route Optimizer architecture</title>
<desc id="d">Layered diagram. Compose screens and a MapLibre map talk to a shared PlanViewModel. The view model uses the domain engine (RoutingEngine A star search, EnergyModel, ChargingModel, CalibrationStore) and the repositories (Route, Station, Weather, Geocoding, ObdSocReader, Automation). Repositories call the GraphHopper, OpenChargeMap, Open-Meteo and Photon APIs through Retrofit, cache in a Room database, and read state of charge from an ELM327 OBD-II Bluetooth adapter. A WorkManager TripPrefetchWorker pre-warms the caches in the background.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L9 5L0 9z" fill="#475569"/></marker></defs>
<rect width="360" height="640" rx="12" fill="#f8fafc"/>
<g font-size="11" fill="#0f172a" text-anchor="middle">
<text x="180" y="22" font-size="13" font-weight="700">EV Route Optimizer - architecture</text>

<rect x="12" y="34" width="336" height="92" rx="8" fill="#e0f2fe" stroke="#0369a1"/>
<text x="180" y="50" font-weight="700" fill="#075985">ui/ - Jetpack Compose + Material 3</text>
<rect x="22" y="58" width="100" height="26" rx="5" fill="#fff" stroke="#0369a1"/><text x="72" y="75">PlanScreen</text>
<rect x="130" y="58" width="100" height="26" rx="5" fill="#fff" stroke="#0369a1"/><text x="180" y="75">ItineraryScreen</text>
<rect x="238" y="58" width="100" height="26" rx="5" fill="#fff" stroke="#0369a1"/><text x="288" y="75">ResultsScreen</text>
<rect x="22" y="92" width="152" height="26" rx="5" fill="#fff" stroke="#0369a1"/><text x="98" y="109">NavigationScreen</text>
<rect x="182" y="92" width="156" height="26" rx="5" fill="#fff" stroke="#0369a1"/><text x="260" y="109">MapScreen (MapLibre)</text>

<path d="M180 126V144" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="12" y="146" width="336" height="40" rx="8" fill="#ede9fe" stroke="#6d28d9"/>
<text x="180" y="163" font-weight="700" fill="#5b21b6">PlanViewModel</text>
<text x="180" y="178" font-size="10">single instance shared by all screens (Koin)</text>

<path d="M96 186V206M264 186V206" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="12" y="208" width="168" height="154" rx="8" fill="#dcfce7" stroke="#15803d"/>
<text x="96" y="224" font-weight="700" fill="#166534">domain/engine</text>
<rect x="22" y="232" width="148" height="44" rx="5" fill="#fff" stroke="#15803d"/>
<text x="96" y="249" font-weight="700">RoutingEngine</text><text x="96" y="264" font-size="10">A* over (waypoint, SoC)</text>
<rect x="22" y="284" width="148" height="22" rx="5" fill="#fff" stroke="#15803d"/><text x="96" y="299">EnergyModel</text>
<rect x="22" y="312" width="148" height="22" rx="5" fill="#fff" stroke="#15803d"/><text x="96" y="327">ChargingModel</text>
<rect x="22" y="338" width="148" height="20" rx="5" fill="#fff" stroke="#15803d"/><text x="96" y="352">CalibrationStore</text>

<rect x="192" y="208" width="156" height="154" rx="8" fill="#fef3c7" stroke="#b45309"/>
<text x="270" y="224" font-weight="700" fill="#92400e">data/repository</text>
<g font-size="10.5">
<rect x="200" y="232" width="140" height="19" rx="5" fill="#fff" stroke="#b45309"/><text x="270" y="245">RouteRepository</text>
<rect x="200" y="255" width="140" height="19" rx="5" fill="#fff" stroke="#b45309"/><text x="270" y="268">StationRepository</text>
<rect x="200" y="278" width="140" height="19" rx="5" fill="#fff" stroke="#b45309"/><text x="270" y="291">WeatherRepository</text>
<rect x="200" y="301" width="140" height="19" rx="5" fill="#fff" stroke="#b45309"/><text x="270" y="314">GeocodingRepository</text>
<rect x="200" y="324" width="140" height="19" rx="5" fill="#fff" stroke="#b45309"/><text x="270" y="337">ObdSocReader</text>
