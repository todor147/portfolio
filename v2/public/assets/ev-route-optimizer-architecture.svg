<rect x="22" y="416" width="204" height="20" rx="5" fill="#fff" stroke="#be185d"/><text x="124" y="430">GraphHopperApi - roads, elevation</text>
<rect x="22" y="440" width="204" height="20" rx="5" fill="#fff" stroke="#be185d"/><text x="124" y="454">OpenChargeMapApi - chargers</text>
<rect x="22" y="464" width="204" height="20" rx="5" fill="#fff" stroke="#be185d"/><text x="124" y="478">OpenMeteoApi - temperature</text>
<rect x="22" y="488" width="204" height="12" rx="3" fill="#fff" stroke="#be185d"/><text x="124" y="498" font-size="9.5">PhotonApi - geocoding</text>

<rect x="246" y="392" width="102" height="52" rx="8" fill="#f1f5f9" stroke="#475569"/>
<text x="297" y="410" font-weight="700">Room DB</text>
<text x="297" y="424" font-size="10">AppDatabase</text>
<text x="297" y="437" font-size="9.5">route / station / prefs</text>
<rect x="246" y="452" width="102" height="52" rx="8" fill="#f1f5f9" stroke="#475569"/>
<text x="297" y="470" font-weight="700">OBD-II</text>
<text x="297" y="484" font-size="10">ELM327 adapter</text>
<text x="297" y="497" font-size="9.5">Bluetooth, SoC</text>

<rect x="12" y="524" width="336" height="64" rx="8" fill="#ccfbf1" stroke="#0f766e"/>
<text x="180" y="541" font-weight="700" fill="#115e59">automation/ - WorkManager</text>
<text x="180" y="556">TripPrefetchWorker, ReminderScheduler,</text>
<text x="180" y="570">TripReminderReceiver</text>
<text x="180" y="583" font-size="10">pre-warms route and weather caches</text>

<text x="180" y="612" font-size="10" fill="#475569">Solid arrows: calls / data flow. Dashed: engine inputs.</text>
<text x="180" y="626" font-size="10" fill="#475569">Source: github.com/todor147/ev-route-optimizer</text>
</g>
</svg>
