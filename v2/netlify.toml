# Netlify configuration for Portfolio v2.0
#
# The repo-root netlify.toml is the authoritative Netlify config (base = "v2").
# This copy under v2/ is kept byte-identical for safety; edit both together.

[build]
  base    = "v2"
  command = "npm install && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Long cache on hashed asset files (Astro emits hashes in filenames).
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Standard cache for raw images served from /assets.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Generated Open Graph images: cache for a week (they change when content does).
[[headers]]
  for = "/og/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Security headers for every response.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options       = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"
